name: Bug report
description: Report a reproducible Fluxa problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include ADMIN_TOKEN, SUB_TOKEN, CLIENT_UUID, TROJAN_PASSWORD, upstream credentials, or private subscription URLs."
  - type: input
    id: version
    attributes:
      label: Fluxa version
      placeholder: v0.8.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Worker proxy core
        - Clash/Mihomo subscription
        - sing-box subscription
        - Loon subscription
        - Surge subscription
        - Node catalog / FluxScore
        - Admin / diagnostics
        - Deployment / Wrangler
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use redacted/example hostnames and credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed all secrets, private subscription URLs, and credentials from this report.
          required: true
