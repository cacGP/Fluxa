name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Wrangler deployment dry-run
        if: matrix.node == 24
        shell: bash
        run: |
          cat > .ci-secrets.env <<'SECRETS'
          ADMIN_TOKEN=ci-admin-token-0123456789abcdef
          SUB_TOKEN=ci-sub-token-0123456789abcdef00
          CLIENT_UUID=11111111-1111-4111-8111-111111111111
          TROJAN_PASSWORD=ci-trojan-password-0123456789
          SECRETS
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run --secrets-file .ci-secrets.env
          rm -f .ci-secrets.env
