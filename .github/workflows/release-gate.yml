name: Release gate
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run release-check
      - name: Wrangler deployment dry-run
        shell: bash
        run: |
          cat > .ci-secrets.env <<'SECRETS'
          ADMIN_TOKEN=ci-admin-token-0123456789abcdef
          SUB_TOKEN=ci-sub-token-0123456789abcdef00
          CLIENT_UUID=11111111-1111-4111-8111-111111111111
          TROJAN_PASSWORD=ci-trojan-password-0123456789
          SECRETS
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run --secrets-file .ci-secrets.env
          rm -f .ci-secrets.env
      - name: Build source archive
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.wrangler-dry-run --exclude=.ci-secrets.env -czf "fluxa-${GITHUB_REF_NAME}-source.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: fluxa-${{ github.ref_name }}-source
          path: fluxa-${{ github.ref_name }}-source.tar.gz
